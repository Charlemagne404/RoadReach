<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | RoadReach</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, "Segoe UI", sans-serif;
        --bg: #f4f0e8;
        --panel: rgba(255, 252, 248, 0.92);
        --text: #171411;
        --muted: #6e675f;
        --accent: #176b66;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(188, 127, 67, 0.14), transparent 30%),
          radial-gradient(circle at bottom right, rgba(23, 107, 102, 0.12), transparent 28%),
          linear-gradient(180deg, #f8f5ef 0%, #f0ebe2 100%);
      }

      main {
        width: min(560px, 100%);
        padding: 32px;
        border: 1px solid rgba(53, 43, 30, 0.1);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 72px rgba(63, 45, 23, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 0.98;
      }

      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404 error</p>
      <h1>This route is not available.</h1>
      <p>
        The page may have moved, the link may be outdated, or the address may be incorrect.
      </p>
      <p>
        Return to <a href="/">RoadReach</a> to start a new reachability search.
      </p>
    </main>
  </body>
</html>
